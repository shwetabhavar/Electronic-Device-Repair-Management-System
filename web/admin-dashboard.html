<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <p class="welcome">
        Electronic Device Repair Management System
    </p>


    <!-- ==========================================
         DASHBOARD CARDS
         ========================================== -->

    <div class="dashboard-grid">

        <div class="dashboard-card">

            <h3>Total Repairs</h3>

            <p id="totalRepairs">0</p>

        </div>


        <div class="dashboard-card">

            <h3>Pending</h3>

            <p id="pendingRepairs">0</p>

        </div>


        <div class="dashboard-card">

            <h3>In Progress</h3>

            <p id="progressRepairs">0</p>

        </div>


        <div class="dashboard-card">

            <h3>Completed</h3>

            <p id="completedRepairs">0</p>

        </div>

    </div>


    <!-- ==========================================
         RECENT REPAIR REQUESTS
         ========================================== -->

    <div class="table-container">

        <h2>Recent Repair Requests</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Customer</th>

                    <th>Device</th>

                    <th>Status</th>

                    <th>Technician</th>

                </tr>

            </thead>


            <tbody id="recentRepairs">

            </tbody>

        </table>

    </div>


    <!-- ==========================================
         ADMIN OPTIONS
         ========================================== -->

    <button
        onclick="window.location.href='customers.html'">

        View Customers

    </button>


    <button
        onclick="window.location.href='technicians.html'">

        View Technicians

    </button>


    <button
        onclick="window.location.href='repair-requests.html'">

        View All Repair Requests

    </button>


    <button
        onclick="window.location.href='assign-technician.html'">

        Assign Technician

    </button>


    <!-- ==========================================
         LOGOUT
         ========================================== -->

    <button
        class="back"
        onclick="window.location.href='index.html'">

        Logout

    </button>

</div>


<script>

/* ==========================================
   LOAD DASHBOARD DATA
   ========================================== */

fetch("/api/repairs")

    .then(response => response.json())

    .then(data => {


        /* ==========================================
           TOTAL REPAIRS
           ========================================== */

        document.getElementById(
            "totalRepairs"
        ).innerText = data.length;


        /* ==========================================
           STATUS COUNTERS
           ========================================== */

        let pending = 0;

        let progress = 0;

        let completed = 0;


        data.forEach(repair => {


            if (repair.status === "Pending") {

                pending++;

            }


            if (repair.status === "In Progress") {

                progress++;

            }


            if (repair.status === "Completed") {

                completed++;

            }

        });


        /* ==========================================
           DISPLAY COUNTERS
           ========================================== */

        document.getElementById(
            "pendingRepairs"
        ).innerText = pending;


        document.getElementById(
            "progressRepairs"
        ).innerText = progress;


        document.getElementById(
            "completedRepairs"
        ).innerText = completed;


        /* ==========================================
           RECENT REPAIR REQUESTS
           ========================================== */

        let table =
            document.getElementById(
                "recentRepairs"
            );


        /*
         * Last 5 repair requests
         * Newest request first
         */

        data
            .slice(-5)
            .reverse()
            .forEach(repair => {


                let row =
                    document.createElement("tr");


                row.innerHTML =

                    "<td>" +
                    repair.id +
                    "</td>" +

                    "<td>" +
                    repair.customer +
                    "</td>" +

                    "<td>" +
                    repair.device +
                    "</td>" +

                    "<td>" +
                    repair.status +
                    "</td>" +

                    "<td>" +
                    repair.technician +
                    "</td>";


                table.appendChild(row);

            });


        /* ==========================================
           NO REPAIR REQUEST
           ========================================== */

        if (data.length === 0) {

            let row =
                document.createElement("tr");


            row.innerHTML =
                "<td colspan='5'>" +
                "No repair requests found." +
                "</td>";


            table.appendChild(row);

        }

    })


    .catch(error => {

        console.log(
            "Error loading dashboard:",
            error
        );

    });

</script>


</body>

</html>
