<!DOCTYPE html>
<html>

<head>

    <title>Assign Technician</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Assign Technician</h1>

    <p class="welcome">
        Assign a technician to a repair request
    </p>


    <label>Repair Request</label>

    <select id="repair">

        <option value="">
            Loading repair requests...
        </option>

    </select>


    <label>Technician</label>

    <select id="technician">

        <option value="T001">
            T001 - Rohit - Laptop Repair
        </option>

        <option value="T002">
            T002 - Akash - Mobile Repair
        </option>

    </select>


    <button onclick="assignTechnician()">

        Assign Technician

    </button>


    <p id="message"></p>


    <button
        class="back"
        onclick="window.location.href='admin-dashboard.html'">

        Back to Dashboard

    </button>

</div>


<script>

/* ==========================================
   LOAD REPAIR REQUESTS
   ========================================== */

fetch("/api/repairs")

    .then(response => response.json())

    .then(data => {

        let repairSelect =
            document.getElementById("repair");

        repairSelect.innerHTML = "";


        data.forEach(repair => {

            let option =
                document.createElement("option");

            option.value = repair.id;

            option.textContent =
                repair.id +
                " - " +
                repair.customer +
                " - " +
                repair.device +
                " - " +
                repair.status;

            repairSelect.appendChild(option);

        });


        if (data.length === 0) {

            let option =
                document.createElement("option");

            option.textContent =
                "No repair requests found";

            repairSelect.appendChild(option);

        }

    })


    .catch(error => {

        console.log(
            "Error loading repairs:",
            error
        );

        document.getElementById("repair").innerHTML =
            "<option>Error loading requests</option>";

    });



/* ==========================================
   ASSIGN TECHNICIAN
   ========================================== */

function assignTechnician() {

    let repair =
        document.getElementById("repair").value;


    let technician =
        document.getElementById("technician").value;


    if (repair === "") {

        document.getElementById("message").innerText =
            "Please select a repair request.";

        return;

    }


    let formData =
        "repair=" +
        encodeURIComponent(repair) +

        "&technician=" +
        encodeURIComponent(technician);


    fetch("/api/repairs/assign", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/x-www-form-urlencoded"

        },

        body: formData

    })


    .then(response => response.text())


    .then(message => {

        document.getElementById("message").innerText =
            message;

    })


    .catch(error => {

        document.getElementById("message").innerText =
            "Error assigning technician.";

        console.log(error);

    });

}

</script>


</body>

</html>
